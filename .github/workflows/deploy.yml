name: Deploy to GitHub Pages

# Publishes the app together with the TeX engine, all same-origin, so there is no
# second service to run and no CORS to configure.
#
# The engine's ~94MB is fetched from the CDN at build time rather than committed,
# which keeps the repository small. Only the bundles in required-bundles.txt are
# pulled: the other ~130MB is unreachable from the problem set.
#
# To serve the engine from object storage instead (no bandwidth ceiling), set the
# TEX_BASE repository variable to its URL; the fetch step then skips itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v5

      - run: npm ci

      - name: Check types and unit tests
        run: |
          npx tsc --noEmit
          npm test

      # The worker must be same-origin, so it is always staged locally.
      - name: Stage the engine worker
        run: bash scripts/copy-worker.sh

      # Skipped when TEX_BASE points the engine somewhere else.
      - name: Fetch the TeX engine
        if: ${{ !vars.TEX_BASE }}
        run: bash scripts/fetch-tex-assets.sh --required

      - name: Build
        env:
          # Unset by default, so the engine resolves to <base>/tex alongside the
          # app. Set it to serve the engine from object storage instead.
          VITE_TEX_BASE: ${{ vars.TEX_BASE }}
          # Optional collector for sanitized reliability events. Empty disables it.
          VITE_TELEMETRY_ENDPOINT: ${{ vars.TELEMETRY_ENDPOINT }}
          # A project page lives at /<repo>/; a user or custom-domain site at /.
          VITE_BASE: ${{ vars.PAGES_BASE || format('/{0}/', github.event.repository.name) }}
        run: npx vite build

      - name: Report what is being published
        run: |
          echo "### Deploy contents" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist >> "$GITHUB_STEP_SUMMARY"
          du -sh dist/tex 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Pages serves 404.html for unknown paths. The game is a single page, so
      # pointing that at the app keeps a stale or shared deep link playable.
      - name: Add 404 fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
